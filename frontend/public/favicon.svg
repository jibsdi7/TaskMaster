<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5B7CF6"/>
      <stop offset="100%" stop-color="#9B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C9FFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0F0F1A"/>
  <!-- Top arc -->
  <path d="M 7 16 C 11 8, 21 8, 25 16"
        stroke="url(#g2)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bottom arc -->
  <path d="M 7 16 C 11 24, 21 24, 25 16"
        stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Cross threads -->
  <path d="M 7 16 C 13 13, 19 19, 25 16"
        stroke="url(#g1)" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <path d="M 7 16 C 13 19, 19 13, 25 16"
        stroke="url(#g2)" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <!-- Nodes -->
  <circle cx="7"  cy="16" r="2.5" fill="url(#g1)"/>
  <circle cx="25" cy="16" r="2.5" fill="url(#g2)"/>
</svg>
