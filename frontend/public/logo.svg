<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Main brand gradient: indigo → violet -->
    <linearGradient id="g1" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5B7CF6"/>
      <stop offset="100%" stop-color="#9B5CF6"/>
    </linearGradient>
    <!-- Lighter accent gradient for the woven threads -->
    <linearGradient id="g2" x1="0" y1="200" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C9FFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip to rounded square -->
    <clipPath id="clip">
      <rect width="200" height="200" rx="42" ry="42"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="42" fill="#0F0F1A"/>

  <!-- Subtle inner vignette ring -->
  <rect width="200" height="200" rx="42" fill="none"
        stroke="url(#g1)" stroke-width="1.5" opacity="0.35"/>

  <!-- ── The woven-flow mark ── -->
  <!-- Three flowing bezier threads that cross and weave.
       They fan out from the left cluster, cross in the centre,
       and converge into the right cluster — visually suggesting
       a woven graph / workflow. -->

  <!-- Thread 1 — top arc, wide sweep -->
  <path d="M 46 100 C 68 52, 132 52, 154 100"
        stroke="url(#g2)" stroke-width="11" stroke-linecap="round"
        opacity="0.9" filter="url(#glow)"/>

  <!-- Thread 3 — bottom arc, wide sweep -->
  <path d="M 46 100 C 68 148, 132 148, 154 100"
        stroke="url(#g1)" stroke-width="11" stroke-linecap="round"
        opacity="0.9" filter="url(#glow)"/>

  <!-- Thread 2 — middle crossing thread (slightly thicker, full gradient) -->
  <path d="M 46 100 C 80 80, 120 120, 154 100"
        stroke="url(#g1)" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <path d="M 46 100 C 80 120, 120 80, 154 100"
        stroke="url(#g2)" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <!-- Left node (entry) -->
  <circle cx="46" cy="100" r="13" fill="url(#g1)" filter="url(#glow)"/>
  <circle cx="46" cy="100" r="6"  fill="#ffffff" opacity="0.9"/>

  <!-- Right node (exit) -->
  <circle cx="154" cy="100" r="13" fill="url(#g2)" filter="url(#glow)"/>
  <circle cx="154" cy="100" r="6"  fill="#ffffff" opacity="0.9"/>

  <!-- Centre crossover highlight — small diamond -->
  <circle cx="100" cy="100" r="5" fill="#ffffff" opacity="0.55"/>
</svg>
